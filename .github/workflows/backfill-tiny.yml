name: Backfill Tiny Thumbnails

# One-off, run by hand: makes the review list's small thumbnails for artwork
# imported before the importer made them. Writes R2 only; safe to re-run.
# See scripts/backfill-tiny.ts. Delete this workflow once it has run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Count only, write nothing"
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: npx tsx scripts/backfill-tiny.ts ${{ inputs.dry_run && '--dry-run' || '' }}
