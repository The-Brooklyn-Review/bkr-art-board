name: Keep Supabase Awake

on:
  schedule:
    # Every 6 days at midnight UTC (prevents 7-day free tier inactivity shutdown)
    - cron: "0 0 */6 * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Ping Supabase database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();

          (async () => {
            try {
              const count = await prisma.artAsset.count();
              console.log('✅ Supabase is awake. Asset count:', count);
              await prisma.\$disconnect();
            } catch (error) {
              console.error('❌ Failed to ping Supabase:', error.message);
              process.exit(1);
            }
          })();
          "
